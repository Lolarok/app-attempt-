name: Refresh Euro Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run refresh
        run: |
          python -c "from euro_analytics.refresh import refresh_competition; refresh_competition('EuroLeague'); refresh_competition('EuroCup')"

      - name: Commit generated status
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Refresh Euro Analytics status"
            git push
          fi